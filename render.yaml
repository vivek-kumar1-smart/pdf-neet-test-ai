services:
  - type: web
    name: pdf-neet-test-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://vivek-kumar1-smart.github.io
